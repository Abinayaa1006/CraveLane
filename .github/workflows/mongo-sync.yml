
name: CraveLane MongoDB Sync

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: cravelane-mongo-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify database configuration
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          python -c "import os; print('Host configured:', bool(os.getenv('DB_HOST'))); print('Port configured:', bool(os.getenv('DB_PORT'))); print('User configured:', bool(os.getenv('DB_USER'))); print('Password configured:', bool(os.getenv('DB_PASSWORD'))); print('Password length:', len(os.getenv('DB_PASSWORD', ''))); print('Database:', os.getenv('DB_NAME'))"

      - name: Run MongoDB synchronization
        env:
          USE_CLOUD_DB: "true"
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          MONGO_DB_NAME: cravelane
        run: python -m scripts.mongo_sync_worker --once
